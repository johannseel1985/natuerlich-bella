name: hochladen

# Lädt die Live-Website von Natürlich Bella zu ALL-INKL hoch,
# sobald etwas auf dem Zweig "live" landet (oder per Hand gestartet).
# Verschlüsselt per FTPS (explizites TLS). Es wird nichts auf dem Server gelöscht.
on:
  push:
    branches: [live]
  workflow_dispatch:
    inputs:
      probelauf:
        description: 'Nur testen, nichts hochladen'
        type: boolean
        default: true

concurrency:
  group: hochladen
  cancel-in-progress: false

jobs:
  hochladen:
    runs-on: ubuntu-latest
    env:
      HAT_ZUGANG: ${{ secrets.FTP_BENUTZER != '' }}
      PROBELAUF: ${{ github.event_name == 'workflow_dispatch' && inputs.probelauf }}
    steps:
      - name: Zugang vorhanden?
        if: env.HAT_ZUGANG != 'true'
        run: echo "::notice::Noch keine FTP-Zugangsdaten hinterlegt, Upload übersprungen."
      - uses: actions/checkout@v4
        if: env.HAT_ZUGANG == 'true'
      - name: lftp installieren
        if: env.HAT_ZUGANG == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Per FTPS zu ALL-INKL hochladen
        if: env.HAT_ZUGANG == 'true'
        env:
          FTP_BENUTZER: ${{ secrets.FTP_BENUTZER }}
          FTP_PASSWORT: ${{ secrets.FTP_PASSWORT }}
        run: |
          export LFTP_PASSWORD="$FTP_PASSWORT"
          EXTRA=""
          if [ "$PROBELAUF" = "true" ]; then EXTRA="--dry-run"; echo "Probelauf: es wird nichts hochgeladen."; fi
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 1;
            set net:timeout 30;
            open -u "$FTP_BENUTZER" --env-password ftp://w022795d.kasserver.com;
            mirror --reverse --verbose $EXTRA \
              --exclude-glob .git* --exclude-glob .git/ --exclude-glob .github/ --exclude-glob README.md \
              ./ ./
          "
